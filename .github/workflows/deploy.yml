name: Deploy to GitHub Pages
# Trigger deployment again

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: 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
        publish_dir: ./docs